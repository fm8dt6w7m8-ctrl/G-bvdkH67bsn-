
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windows Recovery</title>
<style>
body{margin:0;background:#050707;color:#00ff41;font-family:Consolas,monospace}
.window{background:#c0c0c0;color:black;width:min(600px,94vw);margin:12vh auto;border:3px outset white}
.bar{background:navy;color:white;padding:9px;font-weight:bold}
.content{padding:18px;text-align:center}
h1{color:red;animation:blink .7s infinite}
@keyframes blink{50%{opacity:.25}}
input{padding:13px;width:75%;font-size:18px;text-align:center}
button{padding:12px 18px;margin:9px;background:#c0c0c0;border:3px outset white;font-weight:bold;cursor:pointer}
.green{background:#080808;color:#00ff41;padding:15px;text-align:left;font-size:13px}
#pay{display:none;background:#a00000;color:white;font-size:20px}
</style>
</head>
<body>
<div class="window">
<div class="bar">⚠ WINDOWS 98 - SYSTEM RECOVERY</div>
<div class="content">
<div class="green">
SYSTEM STATUS: LOCKED<br>
RECOVERY CONSOLE ACTIVE<br>
SECURITY ALERT DETECTED<br>
</div>
<h1>SYSTEM LOCKED</h1>
<p>ENTER RECOVERY CODE TO UNLOCK</p>
<input id="code" placeholder="ENTER 6-DIGIT CODE" maxlength="6">
<br>
<button onclick="check()">UNLOCK SYSTEM</button>
<br>
<button onclick="location.href='code.html'">GET RECOVERY CODE</button>
<p id="status"></p>
<button id="pay" onclick="location.href='prank.html'">
PAY $100,000
</button>
</div>
</div>
<script>
function check(){
 const entered=document.getElementById("code").value;
 const saved=localStorage.getItem("recoveryCode");
 const status=document.getElementById("status");
 if(saved && entered===saved){
  status.textContent="ACCESS GRANTED";
  status.style.color="green";
  document.getElementById("pay").style.display="inline-block";
 }else{
  status.textContent="INVALID RECOVERY CODE";
  status.style.color="red";
 }
}
</script>
</body>
</html>
